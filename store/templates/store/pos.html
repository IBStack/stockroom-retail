{% extends 'store/base.html' %}{% block title %}Point of sale{% endblock %}{% block heading %}Point of sale{% endblock %}{% block content %}<form method="post" action="/pos/checkout/" class="grid lg:grid-cols-3 gap-6">{% csrf_token %}<div class="lg:col-span-2 grid sm:grid-cols-2 xl:grid-cols-3 gap-4">{% for product in products %}<label class="bg-white rounded-2xl border border-black/5 p-5 cursor-pointer hover:border-moss"><input type="checkbox" name="product_id" value="{{ product.id }}" class="accent-moss"><p class="font-bold mt-4">{{ product.name }}</p><p class="text-xs text-slate-500">{{ product.sku }} · {{ product.stock }} in stock</p><p class="text-xl font-black mt-3">${{ product.price|floatformat:2 }}</p><input name="quantity_{{ product.id }}" type="number" min="0" max="{{ product.stock }}" value="0" class="mt-4 w-full rounded-lg border border-black/10 px-3 py-2"></label>{% endfor %}</div><aside class="bg-ink text-white rounded-2xl p-6 h-fit"><h2 class="text-lg font-bold">Complete sale</h2><p class="text-sm text-white/60 mt-2">Select products and enter quantities on the left.</p><label class="block mt-6 text-sm">Payment method<select name="payment_method" class="mt-2 w-full rounded-xl px-3 py-3 text-ink"><option value="cash">Cash</option><option value="card">Card</option><option value="transfer">Transfer</option></select></label><button class="mt-6 w-full bg-sun text-ink rounded-xl py-3 font-black">Complete transaction</button></aside></form>{% endblock %}
