{% extends 'store/base.html' %}{% block title %}Product{% endblock %}{% block heading %}{% if product %}Edit product{% else %}Add product{% endif %}{% endblock %}{% block content %}<form method="post" class="bg-white rounded-2xl border border-black/5 p-6 max-w-2xl">{% csrf_token %}<div class="grid md:grid-cols-2 gap-5">{% for label, name, type in fields %}{% endfor %}<label class="block"><span class="text-sm font-semibold">SKU</span><input required name="sku" value="{{ product.sku|default:'' }}" class="mt-2 w-full rounded-xl border border-black/10 px-4 py-3"></label><label class="block"><span class="text-sm font-semibold">Product name</span><input required name="name" value="{{ product.name|default:'' }}" class="mt-2 w-full rounded-xl border border-black/10 px-4 py-3"></label><label class="block"><span class="text-sm font-semibold">Category</span><select required name="category" class="mt-2 w-full rounded-xl border border-black/10 px-4 py-3">{% for category in categories %}<option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label class="block"><span class="text-sm font-semibold">Selling price</span><input required step="0.01" type="number" name="price" value="{{ product.price|default:'' }}" class="mt-2 w-full rounded-xl border border-black/10 px-4 py-3"></label><label class="block"><span class="text-sm font-semibold">Cost price</span><input step="0.01" type="number" name="cost" value="{{ product.cost|default:'' }}" class="mt-2 w-full rounded-xl border border-black/10 px-4 py-3"></label><label class="block"><span class="text-sm font-semibold">Stock quantity</span><input required type="number" name="stock" value="{{ product.stock|default:0 }}" class="mt-2 w-full rounded-xl border border-black/10 px-4 py-3"></label><label class="block"><span class="text-sm font-semibold">Reorder level</span><input required type="number" name="reorder_level" value="{{ product.reorder_level|default:5 }}" class="mt-2 w-full rounded-xl border border-black/10 px-4 py-3"></label></div><label class="flex gap-2 items-center mt-5"><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}> Active product</label><div class="mt-7 flex gap-3"><button class="bg-moss text-white rounded-xl px-5 py-3 font-bold">Save product</button><a href="/products/" class="rounded-xl px-5 py-3 font-bold">Cancel</a></div></form>{% endblock %}
